[project]
name = "llm-distill"
version = "0.1.0"
description = "Implementations and experiments for LLM knowledge-distillation research papers."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "torch>=2.5",
    "numpy>=2.0",
]

[project.optional-dependencies]
hf = [
    "transformers>=4.46",
    "datasets>=3.0",
    "accelerate>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/llm_distill"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "gpu: requires a CUDA device",
    "slow: long-running (downloads models, trains)",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
